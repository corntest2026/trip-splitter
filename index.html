<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行分帳票根</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+TC:wght@400;500;600;700&display=swap');

:root{
  --ink:#1E2A35;
  --ink-soft:#4A5A66;
  --paper:#F7F2E6;
  --paper-2:#EFE7D4;
  --teal:#0E6B5C;
  --teal-deep:#0A4F45;
  --gold:#C79A3D;
  --coral:#C1442A;
  --line:#D8CDB0;
  --white:#FFFDF8;
  --radius:2px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 1px 1px, rgba(30,42,53,0.06) 1px, transparent 0) 0 0/16px 16px,
    var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans TC','IBM Plex Mono',sans-serif;
  min-height:100vh;
  padding:24px 14px 60px;
}

.app{max-width:640px;margin:0 auto;}

/* ===== Header: boarding-pass strip ===== */
.boardingpass{
  background:var(--ink);
  color:var(--paper);
  border-radius:10px;
  position:relative;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(30,42,53,0.22);
  margin-bottom:22px;
}
.bp-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:20px 22px 16px;
  gap:16px;
}
.bp-eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  letter-spacing:0.22em;
  color:var(--gold);
  text-transform:uppercase;
  margin:0 0 6px;
}
.bp-title-input{
  background:transparent;
  border:none;
  border-bottom:1px dashed rgba(247,242,230,0.35);
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:26px;
  color:var(--paper);
  padding:2px 0 6px;
  width:100%;
  outline:none;
}
.bp-title-input::placeholder{color:rgba(247,242,230,0.4);}
.bp-stub{
  font-family:'IBM Plex Mono',monospace;
  text-align:right;
  flex-shrink:0;
  border-left:1px dashed rgba(247,242,230,0.35);
  padding-left:16px;
  min-width:118px;
}
.bp-stub .num{font-size:26px;font-weight:700;color:var(--gold);line-height:1;}
.bp-stub .lbl{font-size:10px;letter-spacing:0.14em;color:rgba(247,242,230,0.65);margin-top:4px;text-transform:uppercase;}
.bp-stub .lbl-avg{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;
  color:var(--gold);margin-top:6px;padding-top:6px;
  border-top:1px dashed rgba(247,242,230,0.25);
}

.bp-perforation{
  position:relative;
  height:0;
  border-top:1.5px dashed rgba(247,242,230,0.3);
  margin:0 22px;
}
.bp-perforation::before,.bp-perforation::after{
  content:'';
  position:absolute;top:50%;transform:translateY(-50%);
  width:20px;height:20px;background:var(--paper);border-radius:50%;
}
.bp-perforation::before{left:-32px;}
.bp-perforation::after{right:-32px;}

.bp-bottom{
  display:flex;
  padding:14px 22px 18px;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:rgba(247,242,230,0.75);
}
.bp-people-edit{
  display:flex;align-items:center;gap:8px;
}
.bp-people-edit button{
  width:22px;height:22px;border-radius:50%;border:1px solid rgba(247,242,230,0.4);
  background:transparent;color:var(--paper);cursor:pointer;font-size:14px;line-height:1;
}
.bp-people-edit button:hover{background:rgba(247,242,230,0.15);}
.bp-currency-select{
  margin-left:auto;
  background:rgba(247,242,230,0.1);
  border:1px solid rgba(247,242,230,0.3);
  color:var(--gold);
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  padding:4px 8px;
  border-radius:4px;
}
.bp-refresh-btn{
  background:rgba(247,242,230,0.1);
  border:1px solid rgba(247,242,230,0.3);
  color:var(--paper);
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  padding:4px 10px;
  border-radius:4px;
  cursor:pointer;
}
.bp-refresh-btn:hover{background:rgba(247,242,230,0.2);}

.room-badge-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 22px;
  border-bottom:1px dashed rgba(247,242,230,0.25);
  flex-wrap:wrap;
}
.room-badge{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(247,242,230,0.75);
}
.room-badge b{color:var(--gold);letter-spacing:0.02em;}
.room-copy-btn{
  background:var(--gold);color:var(--ink);border:none;border-radius:4px;
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;
  padding:5px 10px;cursor:pointer;
}
.room-copy-btn:hover{background:#d9ac4a;}

/* ===== Setup / room screens ===== */
.setup-screen{max-width:520px;margin:40px auto 0;}
.setup-eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.22em;
  color:var(--gold);text-transform:uppercase;text-align:center;margin:0 0 10px;
}
.setup-title{
  font-family:'Fraunces',serif;font-weight:700;font-size:30px;text-align:center;margin:0 0 10px;color:var(--ink);
}
.setup-sub{
  text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.7;margin:0 0 26px;
}
.setup-card{
  background:var(--white);border:1px solid var(--line);border-radius:8px;
  padding:20px;margin-bottom:16px;
}
.setup-card h2{font-family:'Fraunces',serif;font-size:17px;margin:0 0 8px;}
.created-card{border-color:var(--gold);}
.created-warning{
  background:#FFF6E5;border:1px solid var(--gold);border-radius:5px;
  padding:10px 12px;color:#7a5a12;font-weight:500;line-height:1.7;
}
#createdRoomLink{
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  color:var(--teal-deep);background:var(--paper-2);cursor:text;
}
.create-room-hint{
  background:var(--paper-2);border-left:3px solid var(--gold);
  padding:8px 10px;margin-top:10px;font-size:11.5px;
}
.setup-loading{
  text-align:center;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);
  padding:40px 0;font-size:13px;
}
.setup-note{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
  line-height:1.8;text-align:center;margin-top:20px;
}
.setup-steps{
  margin:0 0 16px;padding-left:20px;color:var(--ink-soft);font-size:13px;line-height:1.9;
}
.setup-steps a{color:var(--teal-deep);font-weight:600;}
.setup-steps strong{color:var(--ink);}

/* ===== Tabs ===== */
.tabs{display:flex;gap:6px;margin-bottom:18px;}
.tab-btn{
  flex:1;
  padding:10px 8px;
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:6px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  font-weight:600;
  letter-spacing:0.03em;
  color:var(--ink-soft);
  cursor:pointer;
  transition:all .15s;
}
.tab-btn.active{
  background:var(--teal);
  border-color:var(--teal-deep);
  color:var(--white);
}

/* ===== Card ===== */
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:8px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 2px 0 rgba(30,42,53,0.04);
}
.card h2{
  font-family:'Fraunces',serif;
  font-size:18px;
  font-weight:600;
  margin:0 0 14px;
  color:var(--ink);
  display:flex;align-items:center;gap:8px;
}
.section-note{
  font-size:12px;color:var(--ink-soft);margin:-8px 0 14px;line-height:1.6;
}

label{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:5px;
  margin-top:14px;
}
label:first-of-type{margin-top:0;}
input[type=text],input[type=number],select{
  width:100%;
  padding:10px 11px;
  border:1px solid var(--line);
  border-radius:5px;
  font-family:'IBM Plex Sans TC',sans-serif;
  font-size:14.5px;
  background:var(--paper);
  color:var(--ink);
  outline:none;
}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--teal);}
.row{display:flex;gap:10px;}
.row > div{flex:1;}

.people-name-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.people-name-row{display:flex;align-items:center;gap:8px;}
.people-name-row .tag{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);
  width:20px;flex-shrink:0;
}

.chip-group{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;}
.chip{
  padding:7px 12px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--paper);
  font-size:13px;
  cursor:pointer;
  color:var(--ink-soft);
  user-select:none;
}
.chip.on{
  background:var(--teal);
  border-color:var(--teal-deep);
  color:var(--white);
  font-weight:600;
}
.chip-row-actions{display:flex;gap:14px;margin-top:6px;}

.custom-shares{
  margin-top:14px;padding:14px;
  background:var(--paper);border:1px solid var(--line);border-radius:6px;
}
.custom-share-row{
  display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.custom-share-row:last-of-type{margin-bottom:0;}
.custom-share-name{
  flex:1;font-size:13.5px;font-weight:500;
}
.custom-share-row input{width:120px;flex-shrink:0;}
.custom-share-sum{
  margin-top:12px;padding:8px 10px;border-radius:5px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:center;
}
.custom-share-sum.sum-ok{background:#E9F5F0;color:var(--teal-deep);}
.custom-share-sum.sum-warn{background:#FBEAE5;color:var(--coral);}
.link-btn{
  background:none;border:none;color:var(--teal-deep);font-size:11.5px;
  text-decoration:underline;cursor:pointer;padding:0;font-family:'IBM Plex Mono',monospace;
}

.btn-primary{
  margin-top:18px;
  width:100%;
  padding:13px;
  background:var(--coral);
  color:var(--white);
  border:none;
  border-radius:6px;
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:14px;
  letter-spacing:0.03em;
  cursor:pointer;
}
.btn-primary:hover{background:#a63a23;}
.btn-primary:disabled{background:#ccc;cursor:not-allowed;}

/* ===== Expense ticket ===== */
.ticket{
  position:relative;
  background:var(--white);
  border:1px solid var(--line);
  border-left:5px solid var(--teal);
  border-radius:6px;
  padding:13px 14px;
  margin-bottom:10px;
}
.ticket-editing{
  border-left-color:var(--gold);
  box-shadow:0 0 0 2px rgba(199,154,61,0.35);
}
.ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.ticket-title{font-family:'Fraunces',serif;font-weight:600;font-size:15.5px;flex:1;min-width:0;}
.ticket-amt{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;color:var(--teal-deep);margin-top:4px;}
.ticket-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:5px;line-height:1.7;}
.ticket-actions{display:flex;gap:2px;flex-shrink:0;}
.ticket-icon-btn{
  background:none;border:none;color:#A79B79;
  font-size:14px;cursor:pointer;line-height:1;padding:4px 6px;border-radius:4px;
}
.ticket-icon-btn:hover{background:var(--paper-2);color:var(--teal-deep);}
.ticket-icon-del:hover{color:var(--coral);}
.ticket-fx{color:var(--gold);}

.empty-state{
  text-align:center;padding:34px 12px;color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.8;
}

.ticket-list{
  max-height:480px;
  overflow-y:auto;
  padding-right:6px;
  margin-right:-6px;
  scrollbar-width:thin;
  scrollbar-color:var(--gold) var(--paper-2);
}
.ticket-list::-webkit-scrollbar{width:7px;}
.ticket-list::-webkit-scrollbar-track{background:var(--paper-2);border-radius:6px;}
.ticket-list::-webkit-scrollbar-thumb{background:var(--gold);border-radius:6px;}
.ticket-list::-webkit-scrollbar-thumb:hover{background:var(--teal);}
.ticket-list .ticket:last-child{margin-bottom:2px;}

/* ===== Settlement ===== */
.stat-strip{display:flex;gap:10px;margin-bottom:16px;}
.stat-box{
  flex:1;background:var(--ink);color:var(--paper);border-radius:8px;padding:14px 16px;
}
.stat-box .v{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;color:var(--gold);}
.stat-box .l{font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(247,242,230,0.65);margin-top:3px;}

.balance-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;
}
.balance-row:last-child{border-bottom:none;}
.balance-amt{font-family:'IBM Plex Mono',monospace;font-weight:700;}
.balance-amt.pos{color:var(--teal-deep);}
.balance-amt.neg{color:var(--coral);}
.balance-amt.zero{color:var(--ink-soft);font-weight:400;}

.settle-ticket{
  display:flex;align-items:center;gap:10px;
  background:var(--paper);border:1px dashed var(--gold);border-radius:6px;
  padding:12px 14px;margin-bottom:9px;
  font-family:'IBM Plex Mono',monospace;font-size:13.5px;
}
.settle-arrow{color:var(--gold);font-size:15px;}
.settle-amt{margin-left:auto;font-weight:700;color:var(--coral);font-size:15px;}

.member-card{
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
}
.member-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media (min-width:540px){
  .member-grid{grid-template-columns:1fr 1fr;}
}
.member-card-head{
  display:flex;align-items:center;gap:10px;
  background:var(--ink);
  color:var(--paper);
  padding:11px 14px;
}
.member-avatar{
  width:28px;height:28px;border-radius:50%;
  background:var(--gold);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;font-size:14px;
  flex-shrink:0;
}
.member-name{font-family:'Fraunces',serif;font-weight:600;font-size:15.5px;flex:1;}
.member-paid{font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(247,242,230,0.8);white-space:nowrap;}
.member-paid b{color:var(--gold);}
.member-card-body{padding:10px 14px;background:var(--white);}
.member-paid-row{
  padding:8px 14px;background:var(--paper-2);
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
  border-bottom:1px solid var(--line);
}
.member-paid-row b{color:var(--teal-deep);}
.detail-copy-btn{
  background:rgba(247,242,230,0.12);
  border:1px solid rgba(247,242,230,0.3);
  color:var(--paper);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
  padding:4px 9px;border-radius:4px;cursor:pointer;flex-shrink:0;white-space:nowrap;
}
.detail-copy-btn:hover{background:rgba(247,242,230,0.22);}
.detail-scroll{
  max-height:220px;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:var(--gold) var(--paper-2);
}
.detail-scroll::-webkit-scrollbar{width:6px;}
.detail-scroll::-webkit-scrollbar-track{background:var(--paper-2);border-radius:6px;}
.detail-scroll::-webkit-scrollbar-thumb{background:var(--gold);border-radius:6px;}
.detail-scroll::-webkit-scrollbar-thumb:hover{background:var(--teal);}
.mc-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 0;border-bottom:1px solid var(--line);
  font-size:13.5px;
}
.mc-row:last-child{border-bottom:none;}
.mc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.mc-in .mc-dot{background:var(--teal);}
.mc-out .mc-dot{background:var(--coral);}
.mc-amt{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13.5px;}
.mc-in-amt{color:var(--teal-deep);}
.mc-out-amt{color:var(--coral);}
.mc-empty{
  text-align:center;padding:12px 0;color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;font-size:12px;
}

.detail-row{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:8px 0;border-bottom:1px solid var(--line);
  font-size:13.5px;
}
.detail-row:last-child{border-bottom:none;}
.detail-row-main{display:flex;align-items:center;gap:6px;flex:1;min-width:0;}
.detail-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.detail-paid-tag{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  background:var(--teal);color:var(--white);
  padding:2px 6px;border-radius:10px;flex-shrink:0;white-space:nowrap;
}
.detail-payer{
  font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);
  flex-shrink:0;white-space:nowrap;
}
.detail-amt{
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13.5px;
  color:var(--ink);flex-shrink:0;text-align:right;
}
.detail-amt small{font-weight:400;color:var(--gold);font-size:10px;}

.btn-secondary{
  margin-top:14px;
  padding:9px 16px;
  background:var(--white);
  color:var(--teal-deep);
  border:1px solid var(--teal);
  border-radius:6px;
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:12.5px;
  cursor:pointer;
}
.btn-secondary:hover{background:var(--paper-2);}
.btn-secondary:disabled{opacity:0.6;cursor:wait;}

.rate-updated{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
  margin-top:8px;
}
.rate-error{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--coral);
  margin-top:8px;background:#FBEAE5;border:1px solid var(--coral);border-radius:5px;padding:8px 10px;
}

.rates-grid{display:flex;flex-direction:column;gap:9px;margin-top:12px;}
.rates-scroll{
  max-height:260px;
  overflow-y:auto;
  padding-right:6px;
  margin-right:-6px;
  scrollbar-width:thin;
  scrollbar-color:var(--gold) var(--paper-2);
}
.rates-scroll::-webkit-scrollbar{width:7px;}
.rates-scroll::-webkit-scrollbar-track{background:var(--paper-2);border-radius:6px;}
.rates-scroll::-webkit-scrollbar-thumb{background:var(--gold);border-radius:6px;}
.rates-scroll::-webkit-scrollbar-thumb:hover{background:var(--teal);}

.conv-swap-btn{
  width:34px;height:34px;border-radius:50%;
  background:var(--paper);border:1px solid var(--line);
  color:var(--teal-deep);font-size:16px;cursor:pointer;
}
.conv-swap-btn:hover{background:var(--paper-2);}
.conv-result{
  margin-top:14px;padding:14px;
  background:var(--ink);color:var(--paper);
  border-radius:6px;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-size:14px;
}
.conv-result b{color:var(--gold);font-size:16px;}
.rate-row{display:flex;align-items:center;gap:10px;}
.rate-row .cur{width:52px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;flex-shrink:0;}
.rate-row .eq{color:var(--ink-soft);font-size:12px;flex-shrink:0;}
.rate-row input{flex:1;}

.footer-note{
  text-align:center;font-size:11px;color:var(--ink-soft);margin-top:22px;
  font-family:'IBM Plex Mono',monospace;line-height:1.8;
}
.savebadge{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:var(--gold);font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;padding:8px 16px;border-radius:20px;
  transition:transform .25s ease;box-shadow:0 6px 18px rgba(0,0,0,0.25);
  pointer-events:none;
}
.savebadge.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="savebadge" id="saveBadge">已儲存</div>

<script>
/* ---------- 狀態 ---------- */
const CURRENCIES = ['TWD','USD','JPY','KRW','CNY','HKD','EUR','THB','GBP','AUD'];
const DEFAULT_RATES = {TWD:1,USD:31.5,JPY:0.205,KRW:0.0226,CNY:4.35,HKD:4.02,EUR:34.2,THB:0.87,GBP:39.8,AUD:20.5};

let state = null;
let activeTab = 'add';
let saveTimer = null;
let roomId = null;
let appPhase = 'loading'; // 'loading' | 'setup' | 'app'
let setupError = null;
let setupBusy = false;
let joinCodeDraft = '';

// 新的儲存後端：Firebase Realtime Database（規則已開放讀寫，不需要金鑰）
const FIREBASE_DB_URL = 'https://trip-splitter-9e618-default-rtdb.asia-southeast1.firebasedatabase.app';

// 舊的 JSONBin.io 後端，只保留用來搬遷「換後端之前」建立的舊房間資料
const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b';
const JSONBIN_MASTER_KEY = '$2a$10$0caMijUGTZB7Bg2FfLmdy.2x7Q1RzP5/qcg5z6eIY4aNA6pJ80Scy';

function defaultState(){
  return {
    tripTitle:'我的旅行分帳',
    baseCurrency:'TWD',
    people:['我','夥伴2','夥伴3','夥伴4'],
    rates:{...DEFAULT_RATES},
    expenses:[]
  };
}

/* ---------- 雲端房間儲存 (Firebase Realtime Database) ---------- */
function describeNetworkError(e){
  const raw = (e && e.message) || String(e);
  if(/Failed to fetch|NetworkError|Load failed/i.test(raw)){
    return '連不到同步服務（原始錯誤：' + raw + '）。如果你是在 Claude 對話框裡的「預覽視窗」測試，這是正常的——預覽視窗基於安全考量會擋掉對外部網站的連線。請先把這個檔案下載下來，直接用瀏覽器開啟（或上傳到你自己的網頁空間）再試一次。';
  }
  return raw;
}

async function safeErrorText(res){
  try{
    const j = await res.json();
    return j && j.message ? j.message : '';
  }catch(e){
    return '';
  }
}

function generateRoomId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// 幫 fetch 加上逾時保護：連線太久沒回應就直接判定失敗，不會讓畫面無限卡住
function fetchWithTimeout(url, options, timeoutMs = 12000){
  return Promise.race([
    fetch(url, options),
    new Promise((_, reject) => setTimeout(() => reject(new Error('連線逾時，請檢查網路連線或稍後再試')), timeoutMs))
  ]);
}

async function firebaseGet(id){
  const res = await fetchWithTimeout(`${FIREBASE_DB_URL}/rooms/${id}.json`);
  if(!res.ok){
    throw new Error('讀取失敗，伺服器回應代碼 ' + res.status);
  }
  return await res.json(); // 不存在時回傳 null
}

async function firebaseSet(id, value){
  const res = await fetchWithTimeout(`${FIREBASE_DB_URL}/rooms/${id}.json`, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(value)
  });
  if(!res.ok){
    throw new Error('儲存失敗，伺服器回應代碼 ' + res.status);
  }
}

async function firebaseDelete(id){
  const res = await fetchWithTimeout(`${FIREBASE_DB_URL}/rooms/${id}.json`, { method:'DELETE' });
  if(!res.ok){
    throw new Error('刪除失敗，伺服器回應代碼 ' + res.status);
  }
}

// 只在新房間讀不到資料時，嘗試從舊的 JSONBin 房間讀一次做搬遷；失敗就當作沒有舊資料，不影響流程
async function tryMigrateLegacyRoom(id){
  try{
    const res = await fetchWithTimeout(`${JSONBIN_BASE}/${id}/latest`, {
      headers:{ 'X-Master-Key': JSONBIN_MASTER_KEY }
    }, 8000);
    if(!res.ok) return null;
    const data = await res.json();
    return data && data.record ? data.record : null;
  }catch(e){
    return null;
  }
}

function roomUrl(id){
  const url = new URL(location.href);
  url.searchParams.set('room', id);
  return url.toString();
}

const STALE_ROOM_DAYS = 90; // 房間超過幾天沒有任何活動，就會在有人造訪建立/加入畫面時被順手清理

async function initApp(){
  const params = new URLSearchParams(location.search);
  const urlRoom = params.get('room');
  if(urlRoom){
    roomId = urlRoom;
    await enterRoom();
  }else{
    appPhase = 'setup';
    render();
    sweepStaleRooms(); // 背景執行，不阻塞畫面、不用等待、失敗也沒關係
  }
}

// 背景機會性清理：只刪除「有記錄到活動時間、且已超過門檻天數」的房間，
// 沒有活動時間紀錄的房間（例如加了這個功能之前建立的）一律不動，避免誤刪
async function sweepStaleRooms(){
  try{
    const cutoff = Date.now() - STALE_ROOM_DAYS * 24 * 60 * 60 * 1000;
    const url = `${FIREBASE_DB_URL}/rooms.json?orderBy=${encodeURIComponent('"lastActiveAt"')}&endAt=${cutoff}`;
    const res = await fetchWithTimeout(url, undefined, 8000);
    if(!res.ok) return;
    const data = await res.json();
    if(!data) return;
    const staleIds = Object.keys(data).filter(id =>
      typeof data[id].lastActiveAt === 'number' && data[id].lastActiveAt < cutoff
    );
    for(const id of staleIds){
      try{ await firebaseDelete(id); }catch(e){ /* 單筆失敗就跳過，不影響其他房間 */ }
    }
  }catch(e){
    console.error('背景清理略過（不影響使用）', e);
  }
}

async function enterRoom(){
  appPhase = 'loading';
  render();
  try{
    let record = await firebaseGet(roomId);
    if(!record){
      // 新房間找不到資料，嘗試從舊的 JSONBin 房間搬過來（如果這個房間代碼是換後端之前建立的）
      const legacy = await tryMigrateLegacyRoom(roomId);
      if(legacy){
        record = legacy;
      }
    }
    state = record || defaultState();
    // 進房間也算一次活動，順便更新/補上活動時間戳記
    await firebaseSet(roomId, { ...state, lastActiveAt: Date.now() });
    appPhase = 'app';
    history.replaceState(null, '', roomUrl(roomId));
  }catch(e){
    console.error('進入房間失敗', e);
    setupError = describeNetworkError(e);
    appPhase = 'setup';
    roomId = null;
  }
  render();
}

async function createNewRoom(){
  if(setupBusy) return;
  setupBusy = true;
  setupError = null;
  roomCreatedAutoCopied = false;
  createdRoomError = null;
  render();
  try{
    // 這裡只在本機產生房間代碼，還不會真的寫進雲端資料庫——
    // 要等使用者按下「進入房間」確認後才會真正建立，避免建了忘記用、留下孤兒房間占額度
    const id = generateRoomId();
    roomId = id;
    state = defaultState();
    try{
      await navigator.clipboard.writeText(roomUrl(roomId));
      roomCreatedAutoCopied = true;
    }catch(e){
      roomCreatedAutoCopied = false;
    }
    appPhase = 'created';
  }catch(e){
    console.error('準備房間失敗', e);
    setupError = describeNetworkError(e);
  }finally{
    setupBusy = false;
    render();
  }
}

async function enterCreatedRoom(){
  if(createdRoomBusy) return;
  createdRoomBusy = true;
  createdRoomError = null;
  render();
  try{
    // 真正把房間寫進雲端資料庫，房間到這一步才算正式成立
    await firebaseSet(roomId, { ...state, lastActiveAt: Date.now() });
    history.replaceState(null, '', roomUrl(roomId));
    appPhase = 'app';
  }catch(e){
    console.error('建立房間失敗', e);
    createdRoomError = describeNetworkError(e);
  }finally{
    createdRoomBusy = false;
    render();
  }
}

async function joinRoom(){
  if(setupBusy) return;
  const code = joinCodeDraft.trim();
  if(!code) return;
  // 允許貼完整連結或純房間代碼，自動抓出房間代碼
  let id = code;
  try{
    const url = new URL(code);
    const r = url.searchParams.get('room');
    if(r) id = r;
  }catch(e){
    // 不是完整網址，就當作直接貼的是房間代碼
  }
  roomId = id;
  await enterRoom();
}

function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await firebaseSet(roomId, { ...state, lastActiveAt: Date.now() });
      flashSaved('已儲存');
    }catch(e){
      console.error('儲存失敗', e);
      flashSaved('儲存失敗，請檢查網路連線');
    }
  }, 250);
}

function flashSaved(msg){
  const b = document.getElementById('saveBadge');
  if(!b) return;
  b.textContent = msg || '已儲存';
  b.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>b.classList.remove('show'), 1600);
}

/* ---------- 表單暫存 (新增一筆) ---------- */
let draft = {title:'', amount:'', currency:null, payer:0, participants:null};
let fetchingRates = false;
let rateFetchError = null;
let editingId = null;
let convAmount = '1';
let convFrom = null;
let convTo = null;
let roomCreatedAutoCopied = false;
let createdRoomBusy = false;
let createdRoomError = null;

function resetDraft(){
  draft = {
    title:'',
    amount:'',
    currency: state.baseCurrency,
    payer:0,
    participants: state.people.map((_,i)=>i),
    splitMode: 'equal',
    customShares: {}
  };
}

/* ---------- 換算 & 計算 ---------- */
function toBase(amount, currency){
  const r = state.rates[currency] ?? 1;
  return amount * r;
}

// 任意兩個幣別之間互換：先換成基準幣別，再換成目標幣別
function convertAmount(amount, fromCur, toCur){
  const baseAmt = toBase(amount, fromCur);
  const toRate = state.rates[toCur] ?? 1;
  return toRate ? baseAmt / toRate : 0;
}

// 算出一筆消費裡，每個分攤成員各自要負擔多少（換算成基準幣別）；
// 平均分攤就是總額除以人數，自訂金額就是各自輸入的數字（原始幣別）換算過去
function getExpenseShares(e){
  const shares = {};
  if(e.splitMode === 'custom' && e.customShares){
    e.participants.forEach(idx=>{
      const raw = e.customShares[idx] ?? 0;
      shares[idx] = toBase(raw, e.currency);
    });
  }else{
    const share = toBase(e.amount, e.currency) / (e.participants.length || 1);
    e.participants.forEach(idx=>{ shares[idx] = share; });
  }
  return shares;
}

function computeBalances(){
  // balances[i] = 已付(base) - 應付(base)
  const balances = state.people.map(()=>0);
  state.expenses.forEach(e=>{
    const baseAmt = toBase(e.amount, e.currency);
    const shares = getExpenseShares(e);
    balances[e.payer] += baseAmt;
    e.participants.forEach(pIdx=>{ balances[pIdx] -= (shares[pIdx] || 0); });
  });
  return balances;
}

function computePairwiseOwed(){
  // owed[i][j] = i 直接欠 j 多少（base currency），依照每筆消費「參與人欠付款人」直接累加
  const n = state.people.length;
  const owed = Array.from({length:n}, ()=>Array(n).fill(0));
  state.expenses.forEach(e=>{
    const shares = getExpenseShares(e);
    e.participants.forEach(p=>{
      if(p !== e.payer){
        owed[p][e.payer] += (shares[p] || 0);
      }
    });
  });
  return owed;
}

function netPairwise(owed){
  const n = owed.length;
  const net = Array.from({length:n}, ()=>Array(n).fill(0));
  for(let i=0;i<n;i++){
    for(let j=i+1;j<n;j++){
      const diff = owed[i][j] - owed[j][i];
      if(diff > 0.5) net[i][j] = diff;
      else if(diff < -0.5) net[j][i] = -diff;
    }
  }
  return net;
}

function simplifyDebts(balances){
  const creditors = [];
  const debtors = [];
  balances.forEach((amt,i)=>{
    if(amt > 0.5) creditors.push({person:i, amt});
    else if(amt < -0.5) debtors.push({person:i, amt:-amt});
  });
  creditors.sort((a,b)=>b.amt-a.amt);
  debtors.sort((a,b)=>b.amt-a.amt);
  const tx = [];
  let i=0,j=0;
  while(i<debtors.length && j<creditors.length){
    const pay = Math.min(debtors[i].amt, creditors[j].amt);
    if(pay > 0.5){
      tx.push({from:debtors[i].person, to:creditors[j].person, amount:pay});
    }
    debtors[i].amt -= pay;
    creditors[j].amt -= pay;
    if(debtors[i].amt <= 0.5) i++;
    if(creditors[j].amt <= 0.5) j++;
  }
  return tx;
}

function totalSpent(){
  return state.expenses.reduce((s,e)=>s+toBase(e.amount,e.currency),0);
}

// 只計算「全部出遊人數一起分攤」的消費，個人或部分人分攤的消費不算進這個總額
function totalSpentSharedByAll(){
  return state.expenses
    .filter(e => e.participants.length === state.people.length)
    .reduce((s,e)=>s+toBase(e.amount,e.currency),0);
}

function fmt(n){
  return (Math.round(n*10)/10).toLocaleString('zh-Hant-TW',{maximumFractionDigits:1});
}

/* ---------- 匯出 CSV ---------- */
function escapeCsvField(v){
  const s = String(v ?? '');
  if(/[",\n]/.test(s)){
    return '"' + s.replace(/"/g,'""') + '"';
  }
  return s;
}

function csvRow(arr){
  return arr.map(escapeCsvField).join(',');
}

function exportToCsv(){
  const lines = [];
  lines.push(csvRow([state.tripTitle]));
  lines.push(csvRow(['基準幣別', state.baseCurrency]));
  lines.push(csvRow(['出遊人數', state.people.length]));
  lines.push(csvRow(['成員', state.people.join('、')]));
  lines.push('');

  lines.push(csvRow(['—— 消費紀錄 ——']));
  lines.push(csvRow(['名目','金額','幣別',`換算後金額(${state.baseCurrency})`,'付款人','分攤方式','分攤人數','分攤明細']));
  state.expenses.forEach(e=>{
    const shares = getExpenseShares(e);
    const isCustom = e.splitMode === 'custom' && e.customShares;
    const breakdown = e.participants
      .map(i=>`${state.people[i] ?? '—'}:${fmt(shares[i]||0)}`)
      .join('、');
    lines.push(csvRow([
      e.title,
      e.amount,
      e.currency,
      fmt(toBase(e.amount,e.currency)),
      state.people[e.payer] ?? '（已刪除）',
      isCustom ? '自訂金額' : '平均分攤',
      e.participants.length,
      breakdown
    ]));
  });
  lines.push('');

  lines.push(csvRow([`—— 每人淨額 (${state.baseCurrency}) ——`]));
  lines.push(csvRow(['成員','淨額','狀態']));
  const balances = computeBalances();
  state.people.forEach((p,i)=>{
    const b = balances[i];
    const label = b>0.5 ? '可收回' : (b<-0.5 ? '需支付' : '已結清');
    lines.push(csvRow([p, fmt(b), label]));
  });
  lines.push('');

  lines.push(csvRow([`—— 結算明細（誰要付誰多少，${state.baseCurrency}）——`]));
  lines.push(csvRow(['付款方','收款方','金額']));
  const owed = computePairwiseOwed();
  const net = netPairwise(owed);
  let hasSettlement = false;
  for(let i=0;i<state.people.length;i++){
    for(let j=0;j<state.people.length;j++){
      if(net[i][j] > 0.5){
        lines.push(csvRow([state.people[i], state.people[j], fmt(net[i][j])]));
        hasSettlement = true;
      }
    }
  }
  if(!hasSettlement){
    lines.push(csvRow(['（目前帳務已經平衡，大家都不欠誰）']));
  }
  lines.push('');
  lines.push(csvRow(['匯出時間', new Date().toLocaleString('zh-Hant-TW', {hour12:false})]));

  // 開頭加上 UTF-8 BOM，確保 Excel 打開時中文不會變亂碼
  const csvContent = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const safeTitle = (state.tripTitle || '分帳').replace(/[\\/:*?"<>|]/g, '_');
  a.download = `${safeTitle}_分帳明細.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ---------- 事件處理 ---------- */
function setTab(t){ activeTab = t; render(); }

function changePeopleCount(delta){
  const n = state.people.length + delta;
  if(n < 2 || n > 20) return;
  if(delta > 0){
    state.people.push('夥伴'+n);
  }else{
    state.people.pop();
    state.expenses.forEach(e=>{
      if(e.payer >= state.people.length) e.payer = 0;
      e.participants = e.participants.filter(p=>p < state.people.length);
    });
    // 人數變少時，表單裡還沒送出的草稿也要一起清掉超出範圍的選取，
    // 不然殘留的舊索引存進新消費會讓結算計算整個壞掉
    if(draft.payer >= state.people.length) draft.payer = 0;
    draft.participants = draft.participants.filter(p=>p < state.people.length);
  }
  saveState(); render();
}

function updatePersonName(idx, val){
  state.people[idx] = val || ('夥伴'+(idx+1));
  saveState();
}

function updateBaseCurrency(val){
  state.baseCurrency = val;
  saveState(); render();
}

function updateRate(cur, val){
  const v = parseFloat(val);
  state.rates[cur] = isNaN(v) ? 0 : v;
  saveState();
}

function updateTitle(val){
  state.tripTitle = val;
  saveState();
}

function toggleParticipant(idx){
  const pos = draft.participants.indexOf(idx);
  if(pos >= 0){
    draft.participants.splice(pos,1);
    delete draft.customShares[idx];
  }else{
    draft.participants.push(idx);
    if(draft.splitMode === 'custom' && draft.customShares[idx] === undefined){
      draft.customShares[idx] = '';
    }
  }
  renderAddTabOnly();
}

function selectAllParticipants(all){
  draft.participants = all ? state.people.map((_,i)=>i) : [];
  if(draft.splitMode === 'custom'){
    if(all){
      draft.participants.forEach(idx=>{
        if(draft.customShares[idx] === undefined) draft.customShares[idx] = '';
      });
    }else{
      draft.customShares = {};
    }
  }
  renderAddTabOnly();
}

function setSplitMode(mode){
  draft.splitMode = mode;
  if(mode === 'custom'){
    draft.participants.forEach(idx=>{
      if(draft.customShares[idx] === undefined) draft.customShares[idx] = '';
    });
  }
  renderAddTabOnly();
}

function updateCustomShareSum(){
  const el = document.getElementById('customShareSum');
  if(!el) return;
  const target = parseFloat(draft.amount) || 0;
  const sum = draft.participants.reduce((s,idx)=> s + (parseFloat(draft.customShares[idx]) || 0), 0);
  const diff = Math.round((target - sum) * 100) / 100;
  el.className = 'custom-share-sum ' + (Math.abs(diff) < 0.01 ? 'sum-ok' : 'sum-warn');
  el.textContent = Math.abs(diff) < 0.01
    ? `✓ 合計 ${fmt(sum)}，跟總額相符`
    : `合計 ${fmt(sum)}，跟總額 ${fmt(target)} 差 ${fmt(Math.abs(diff))}（${diff>0?'還沒分完':'超過總額了'}）`;
}

function addExpense(){
  const amt = parseFloat(draft.amount);
  if(!draft.title.trim() || !amt || amt <= 0 || draft.participants.length === 0) return;

  const isCustom = draft.splitMode === 'custom';
  const customShares = isCustom
    ? Object.fromEntries(draft.participants.map(idx=>[idx, parseFloat(draft.customShares[idx]) || 0]))
    : undefined;

  if(editingId !== null){
    const idx = state.expenses.findIndex(e=>e.id===editingId);
    if(idx !== -1){
      const updated = {
        ...state.expenses[idx],
        title: draft.title.trim(),
        amount: amt,
        currency: draft.currency,
        payer: draft.payer,
        participants: [...draft.participants],
        splitMode: draft.splitMode
      };
      if(isCustom) updated.customShares = customShares; else delete updated.customShares;
      state.expenses[idx] = updated;
    }
    editingId = null;
  }else{
    const newExpense = {
      id: Date.now(),
      title: draft.title.trim(),
      amount: amt,
      currency: draft.currency,
      payer: draft.payer,
      participants: [...draft.participants],
      splitMode: draft.splitMode
    };
    if(isCustom) newExpense.customShares = customShares;
    state.expenses.unshift(newExpense);
  }
  saveState();
  resetDraft();
  render();
}

function startEditExpense(id){
  const e = state.expenses.find(x=>x.id===id);
  if(!e) return;
  editingId = id;
  const isCustom = e.splitMode === 'custom' && e.customShares;
  draft = {
    title: e.title,
    amount: String(e.amount),
    currency: e.currency,
    payer: e.payer,
    participants: [...e.participants],
    splitMode: isCustom ? 'custom' : 'equal',
    customShares: isCustom
      ? Object.fromEntries(e.participants.map(idx=>[idx, String(e.customShares[idx] ?? '')]))
      : {}
  };
  activeTab = 'add';
  render();
  const card = document.querySelector('.card');
  if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
}

function cancelEdit(){
  editingId = null;
  resetDraft();
  render();
}

function deleteExpense(id){
  state.expenses = state.expenses.filter(e=>e.id!==id);
  if(editingId === id){ editingId = null; resetDraft(); }
  saveState(); render();
}

async function fetchLiveRates(){
  if(fetchingRates) return;
  fetchingRates = true;
  rateFetchError = null;
  renderAddTabOnly();

  try{
    const res = await fetch(`https://open.er-api.com/v6/latest/${state.baseCurrency}`);
    if(!res.ok) throw new Error('匯率服務回應錯誤 ' + res.status);
    const data = await res.json();
    if(data.result !== 'success' || !data.rates) throw new Error('匯率服務回傳格式異常');

    const currencies = CURRENCIES.filter(c=>c!==state.baseCurrency);
    let updated = 0;
    currencies.forEach(c=>{
      const perBase = data.rates[c]; // 1 個 baseCurrency = perBase 個 c
      if(typeof perBase === 'number' && isFinite(perBase) && perBase > 0){
        state.rates[c] = 1 / perBase; // 換成我們的慣例：1 個 c = 多少 baseCurrency
        updated++;
      }
    });
    state.rates[state.baseCurrency] = 1;

    if(updated === 0){
      rateFetchError = '沒有取得到任何幣別的匯率，請稍後再試，或先手動輸入。';
    }else{
      state.ratesUpdatedAt = new Date().toLocaleString('zh-Hant-TW', {hour12:false});
      saveState();
    }
  }catch(e){
    console.error('更新匯率失敗', e);
    rateFetchError = describeNetworkError(e);
  }finally{
    fetchingRates = false;
    renderAddTabOnly();
  }
}

async function refreshFromShared(){
  const btn = document.getElementById('refreshBtn');
  if(btn){ btn.disabled = true; btn.textContent = '同步中…'; }
  try{
    const incoming = await firebaseGet(roomId);
    if(incoming){
      if(JSON.stringify(incoming) === JSON.stringify(state)){
        flashSaved('已經是最新資料');
      }else{
        state = incoming;
        editingId = null;
        resetDraft();
        render();
        flashSaved('已同步大家的最新紀錄');
        return; // render() already rebuilds the header/button
      }
    }else{
      flashSaved('目前房間裡還沒有資料');
    }
  }catch(e){
    console.error('同步失敗', e);
    flashSaved('同步失敗，請檢查網路連線');
  }finally{
    const b = document.getElementById('refreshBtn');
    if(b){ b.disabled = false; b.textContent = '⟳ 同步'; }
  }
}

  if(appPhase === 'loading'){
    app.innerHTML = renderLoadingScreen();
    return;

  if(appPhase === 'setup'){

  const owedToMe = [];
  const iOwe = [];
  state.people.forEach((_,j)=>{
    if(j===idx) return;
    if(net[j][idx] > 0.5) owedToMe.push({person:j, amount:net[j][idx]});
    if(net[idx][j] > 0.5) iOwe.push({person:j, amount:net[idx][j]});
  });
  owedToMe.sort((a,b)=>b.amount-a.amount);
  iOwe.sort((a,b)=>b.amount-a.amount);
  const initial = (name||'?').trim().charAt(0) || '?';
  const rows = [
    ...owedToMe.map(t=>`
      <div class="mc-row mc-in">
        <span class="mc-dot"></span>
        <span>${escapeHtml(state.people[t.person])} 要付 ${escapeHtml(name)}</span>
        <span class="mc-amt mc-in-amt">${state.baseCurrency} ${fmt(t.amount)}</span>
      </div>`),
    ...iOwe.map(t=>`
      <div class="mc-row mc-out">
        <span class="mc-dot"></span>
        <span>${escapeHtml(name)} 要付 ${escapeHtml(state.people[t.person])}</span>
        <span class="mc-amt mc-out-amt">${state.baseCurrency} ${fmt(t.amount)}</span>
      </div>`)
  ].join('');
  return `
  <div class="member-card">
    <div class="member-card-head">
      <span class="member-avatar">${escapeHtml(initial)}</span>
      <span class="member-name">${escapeHtml(name)}</span>
      <span class="member-paid">共付 <b>${state.baseCurrency} ${fmt(paid)}</b></span>
    </div>
    <div class="member-card-body">
      ${rows || `<div class="mc-empty">已結清，不須收付款 ✓</div>`}
    </div>
  </div>`;
}

function totalPaidByPerson(idx){
  return state.expenses
    .filter(e=>e.payer===idx)
    .reduce((s,e)=>s+toBase(e.amount,e.currency),0);
}

function renderDetailTab(){
  return `
  <div class="stat-strip">
    <div class="stat-box">
      <div class="v">$${fmt(totalSpent())}</div>
      <div class="l">旅行總花費・含個人消費（${state.baseCurrency}）</div>
    </div>
    <div class="stat-box">
      <div class="v">${state.expenses.length}</div>
      <div class="l">消費筆數</div>
    </div>
  </div>

  <div class="card">
    <h2>個人消費明細</h2>
    <p class="section-note">列出每個人自己實際要負擔的每一筆消費（依分攤比例計算），可以看到這趟旅行自己真正花了多少錢——跟「共付」（先幫大家墊了多少）是不同的兩件事。</p>
    <div class="member-grid">
      ${state.people.map((p,i)=>renderDetailCard(p,i)).join('')}
    </div>
  </div>`;
}

function renderDetailCard(name, idx){
  const items = state.expenses.filter(e=>e.participants.includes(idx));
  const total = items.reduce((s,e)=> s + (getExpenseShares(e)[idx] || 0), 0);
  const initial = (name||'?').trim().charAt(0) || '?';
  const rows = items.map(e=>{
    const share = getExpenseShares(e)[idx] || 0;
    const isPayer = e.payer===idx;
    const isForeign = e.currency !== state.baseCurrency;
    return `
    <div class="detail-row">
      <div class="detail-row-main">
        <span class="detail-title">${escapeHtml(e.title)}</span>
        ${isPayer ? `<span class="detail-paid-tag">已付款</span>` : `<span class="detail-payer">${escapeHtml(state.people[e.payer] ?? '—')}先付</span>`}
      </div>
      <span class="detail-amt">${state.baseCurrency} ${fmt(share)}${isForeign ? ` <small>(${e.currency} ${fmt(e.amount)})</small>` : ''}</span>
    </div>`;
  }).join('');
  return `
  <div class="member-card">
    <div class="member-card-head">
      <span class="member-avatar">${escapeHtml(initial)}</span>
      <span class="member-name">${escapeHtml(name)}</span>
      <button class="detail-copy-btn" data-copy-detail="${idx}" title="複製這個人的消費明細">📋 複製</button>
    </div>
    <div class="member-paid-row">個人總開銷 <b>${state.baseCurrency} ${fmt(total)}</b></div>
    <div class="member-card-body detail-scroll">
      ${rows || `<div class="mc-empty">目前沒有分攤任何消費</div>`}
    </div>
  </div>`;
}

function personalDetailText(idx){
  const name = state.people[idx] ?? '（未命名）';
  const items = state.expenses.filter(e=>e.participants.includes(idx));
  const total = items.reduce((s,e)=> s + (getExpenseShares(e)[idx] || 0), 0);
  const lines = [];
  lines.push(`【${name}】個人消費明細 - ${state.tripTitle}`);
  lines.push('--------------------------------');
  if(items.length === 0){
    lines.push('目前沒有分攤任何消費');
  }else{
    items.forEach(e=>{
      const share = getExpenseShares(e)[idx] || 0;
      const tag = e.payer===idx ? '（已付款）' : `（${state.people[e.payer] ?? '—'}先付）`;
      lines.push(`${e.title}：${state.baseCurrency} ${fmt(share)} ${tag}`);
    });
  }
  lines.push('--------------------------------');
  lines.push(`個人總開銷：${state.baseCurrency} ${fmt(total)}`);
  return lines.join('\n');
}

async function copyPersonalDetail(idx){
  const text = personalDetailText(idx);
  try{
    await navigator.clipboard.writeText(text);
    flashSaved('已複製到剪貼簿');
  }catch(e){
    console.error('複製失敗', e);
    flashSaved('複製失敗，請手動選取文字');
  }
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- 事件綁定 ---------- */
function bindGlobalEvents(){
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.onclick = ()=>setTab(btn.dataset.tab);
  });

  const titleInput = document.getElementById('tripTitleInput');
  if(titleInput) titleInput.oninput = (e)=>updateTitle(e.target.value);

  const peopleMinus = document.getElementById('peopleMinus');
  const peoplePlus = document.getElementById('peoplePlus');
  if(peopleMinus) peopleMinus.onclick = ()=>changePeopleCount(-1);
  if(peoplePlus) peoplePlus.onclick = ()=>changePeopleCount(1);

  const baseCurSel = document.getElementById('baseCurrencySelect');
  if(baseCurSel) baseCurSel.onchange = (e)=>updateBaseCurrency(e.target.value);

  const refreshBtn = document.getElementById('refreshBtn');
  if(refreshBtn) refreshBtn.onclick = refreshFromShared;

  const copyBtn = document.getElementById('copyLinkBtn');
  if(copyBtn) copyBtn.onclick = copyRoomLink;

  document.querySelectorAll('.person-name-input').forEach(inp=>{
    inp.oninput = (e)=>updatePersonName(parseInt(inp.dataset.personIdx), e.target.value);
  });

  document.querySelectorAll('[data-rate-cur]').forEach(inp=>{
    inp.oninput = (e)=>updateRate(inp.dataset.rateCur, e.target.value);
  });

  const dTitle = document.getElementById('draftTitle');
  if(dTitle) dTitle.oninput = (e)=>{ draft.title = e.target.value; refreshAddButton(); };

  const dAmount = document.getElementById('draftAmount');
  if(dAmount) dAmount.oninput = (e)=>{ draft.amount = e.target.value; updateConversionNote(); updateCustomShareSum(); refreshAddButton(); };

  const dCurrency = document.getElementById('draftCurrency');
  if(dCurrency) dCurrency.onchange = (e)=>{ draft.currency = e.target.value; updateConversionNote(); };

  const dPayer = document.getElementById('draftPayer');
  if(dPayer) dPayer.onchange = (e)=>{ draft.payer = parseInt(e.target.value); };

  const fetchBtn = document.getElementById('fetchRatesBtn');
  if(fetchBtn) fetchBtn.onclick = fetchLiveRates;

  const convAmountInput = document.getElementById('convAmount');
  if(convAmountInput) convAmountInput.oninput = (e)=>{ convAmount = e.target.value; updateConverterResult(); };

  const convFromSelect = document.getElementById('convFrom');
  if(convFromSelect) convFromSelect.onchange = (e)=>{ convFrom = e.target.value; updateConverterResult(); };

  const convToSelect = document.getElementById('convTo');
  if(convToSelect) convToSelect.onchange = (e)=>{ convTo = e.target.value; updateConverterResult(); };

  const convSwapBtn = document.getElementById('convSwapBtn');
  if(convSwapBtn) convSwapBtn.onclick = ()=>{
    const t = convFrom; convFrom = convTo; convTo = t;
    if(convFromSelect) convFromSelect.value = convFrom;
    if(convToSelect) convToSelect.value = convTo;
    updateConverterResult();
  };

  const exportBtn = document.getElementById('exportCsvBtn');
  if(exportBtn) exportBtn.onclick = exportToCsv;

  document.querySelectorAll('[data-copy-detail]').forEach(btn=>{
    btn.onclick = ()=>copyPersonalDetail(parseInt(btn.dataset.copyDetail));
  });

  document.querySelectorAll('[data-toggle-participant]').forEach(chip=>{
    chip.onclick = ()=>toggleParticipant(parseInt(chip.dataset.toggleParticipant));
  });

  const selAll = document.getElementById('selectAllBtn');
  const selNone = document.getElementById('selectNoneBtn');
  if(selAll) selAll.onclick = ()=>selectAllParticipants(true);
  if(selNone) selNone.onclick = ()=>selectAllParticipants(false);

  document.querySelectorAll('[data-split-mode]').forEach(btn=>{
    btn.onclick = ()=>setSplitMode(btn.dataset.splitMode);
  });

  document.querySelectorAll('[data-custom-share]').forEach(inp=>{
    inp.oninput = (e)=>{
      draft.customShares[inp.dataset.customShare] = e.target.value;
      updateCustomShareSum();
    };
  });
  updateCustomShareSum(); // 畫面剛渲染完，先算一次目前的合計顯示出來

  const addBtn = document.getElementById('addExpenseBtn');
  if(addBtn) addBtn.onclick = addExpense;

  const cancelBtn = document.getElementById('cancelEditBtn');
  if(cancelBtn) cancelBtn.onclick = cancelEdit;

  document.querySelectorAll('[data-edit-expense]').forEach(btn=>{
    btn.onclick = ()=>startEditExpense(parseFloat(btn.dataset.editExpense));
  });

  document.querySelectorAll('[data-delete-expense]').forEach(btn=>{
    btn.onclick = ()=>deleteExpense(parseFloat(btn.dataset.deleteExpense));
  });
}

function updateConversionNote(){
  const note = document.getElementById('conversionNote');
  if(!note) return;
  const otherCurrency = draft.currency !== state.baseCurrency;
  if(otherCurrency && draft.amount){
    note.style.marginTop = '8px';
    note.textContent = `≈ ${fmt(toBase(parseFloat(draft.amount)||0, draft.currency))} ${state.baseCurrency}（依目前匯率換算）`;
  }else{
    note.style.marginTop = '0';
    note.textContent = '';
  }
}

function updateConverterResult(){
  const el = document.getElementById('convResult');
  if(!el) return;
  if(convAmount){
    el.innerHTML = `${escapeHtml(convAmount)} ${convFrom} ≈ <b>${fmt(convertAmount(parseFloat(convAmount)||0, convFrom, convTo))} ${convTo}</b>`;
  }else{
    el.textContent = '輸入金額看換算結果';
  }
}

function refreshAddButton(){
  const btn = document.getElementById('addExpenseBtn');
  if(btn) btn.disabled = !(draft.title.trim() && draft.amount && draft.participants.length>0);
}

async function copyRoomLink(){
  const url = roomUrl(roomId);
  try{
    await navigator.clipboard.writeText(url);
    flashSaved('連結已複製，傳給同行的人吧！');
  }catch(e){
    flashSaved('複製失敗，請手動複製網址列連結');
  }
}

initApp();
</script>
</body>
</html>
